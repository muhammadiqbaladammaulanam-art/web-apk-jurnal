<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absen Masuk - Jurnal Absensi</title>
    <!-- Menghubungkan ke style2.css khusus untuk halaman absen masuk -->
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <div class="app-container">
        <!-- Dashboard Kiri -->
        <aside class="sidebar">
            <h3>Dashboard</h3>
            <ul>
                <!-- Menuju kembali ke halaman beranda utama -->
                <li><a href="index.html">Beranda</a></li>
                <!-- Halaman aktif saat ini -->
                <li><a href="absen-masuk.html" class="active">Absen Masuk</a></li>
            </ul>
        </aside>

        <!-- Konten Utama Form Absen Masuk -->
        <main class="main-content">
            <header>
                <h2 id="judulForm">Buat New Absen Jurnal</h2>
            </header>

            <!-- Formulir Utama Jurnal Absensi -->
            <form id="formJurnalAbsensi">
                
                <!-- TAHAP ATAS: Identitas Waktu Jurnal (New Absen Menggunakan Fitur Pilih) -->
                <section class="form-section">
                    <h3>Identitas Waktu Jurnal</h3>
                    <div class="form-jurnal-atas">
                        <div class="form-group">
                            <label for="hari">Hari:</label>
                            <select id="hari" required>
                                <option value="" disabled selected hidden>Pilih Hari</option>
                                <option value="Senin">Senin</option>
                                <option value="Selasa">Selasa</option>
                                <option value="Rabu">Rabu</option>
                                <option value="Kamis">Kamis</option>
                                <option value="Jumat">Jumat</option>
                                <option value="Sabtu">Sabtu</option>
                                <option value="Minggu">Minggu</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="tanggal">Tanggal:</label>
                            <input type="number" id="tanggal" min="1" max="31" placeholder="15" required>
                        </div>
                        <div class="form-group">
                            <label for="bulan">Bulan:</label>
                            <select id="bulan" required>
                                <option value="" disabled selected hidden>Pilih Bulan</option>
                                <option value="Januari">Januari</option>
                                <option value="Februari">Februari</option>
                                <option value="Maret">Maret</option>
                                <option value="April">April</option>
                                <option value="Mei">Mei</option>
                                <option value="Juni">Juni</option>
                                <option value="Juli">Juli</option>
                                <option value="Agustus">Agustus</option>
                                <option value="September">September</option>
                                <option value="Oktober">Oktober</option>
                                <option value="November">November</option>
                                <option value="Desember">Desember</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="tahun">Tahun:</label>
                            <input type="number" id="tahun" placeholder="2026" required>
                        </div>
                    </div>
                </section>

                <!-- TAHAP BAWAH: Input Absen Siswa dan Status Kehadiran -->
                <section class="form-section">
                    <h3>Isi Data Siswa</h3>
                    <div class="input-siswa-group">
                        <div class="form-group mini">
                            <label for="noAbsen">No Absen:</label>
                            <input type="number" id="noAbsen" placeholder="01">
                        </div>
                        <div class="form-group">
                            <label for="namaSiswa">Nama Siswa:</label>
                            <input type="text" id="namaSiswa" placeholder="Masukkan nama siswa">
                        </div>
                        <div class="form-group">
                            <label for="statusKeterangan">Keterangan:</label>
                            <select id="statusKeterangan">
                                <option value="Belum Diketahui">Belum Diketahui</option>
                                <option value="Hadir">Hadir</option>
                                <option value="Alpha">Alpha</option>
                            </select>
                        </div>
                        <button type="button" id="btnTambahSiswa">Tambah Ke Daftar</button>
                    </div>

                    <!-- Tabel Daftar Sementara Siswa yang Sedang Diabsen Hari Ini -->
                    <h4>Daftar Absensi Siswa Hari Ini</h4>
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 10%;">No Absen</th>
                                <th style="width: 50%;">Nama Siswa</th>
                                <th style="width: 40%;">Keterangan Kehadiran</th>
                            </tr>
                        </thead>
                        <tbody id="listSiswaSementara">
                            <!-- Baris nama dan status siswa akan muncul di sini -->
                        </tbody>
                    </table>
                </section>

                <!-- Tombol Final untuk Menyimpan Seluruh Data ke LocalStorage -->
                <button type="submit" class="btn-simpan-jurnal">Simpan Seluruh Jurnal Absensi</button>
            </form>
        </main>
    </div>

    <!-- Menghubungkan ke berkas JS absen-masuk yang sudah kamu siapkan di folder system -->
    <script src="../system/absen-masuk.js"></script>
</body>
</html>
